id: contoso-expense
name: contoso-expense
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5175
      - http://127.0.0.1:5175
      - https://happy-wilds-2844975c31-westcentralus.webapp.msit.fabricapps.net
      - https://stony-fawn-51d3da02b2-westcentralus.webapp.msit.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: true
    buildCommand: npm run build
    auth:
      type: application
